name: It works on my backup
description: Tell me which HiSuite version / device you successfully tested
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Compatibility reports help a lot. Please do not include your password, backup files or personal data.
  - type: textarea
    id: info
    attributes:
      label: Output of `python -m hisuite_decrypt info "<backup folder>"`
      render: text
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Everything decrypted and exported
        - Databases decrypted, multimedia (.enc) skipped, as documented
        - Partly worked (describe below)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
