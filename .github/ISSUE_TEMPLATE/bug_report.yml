name: Bug report
description: Something does not decrypt or export correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste your password, backup files, decrypted data, real phone
        numbers or names.** See CONTRIBUTING.md for what is safe to share.
        For a security problem use the private "Report a vulnerability" option in the Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Output of `python -m hisuite_decrypt info "<backup folder>"`
      description: Model, HiSuite version and module list. It contains no keys, salts or password.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran (without the password) and the full error message
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.12, Windows 11"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include my password, any file from my backup, decrypted data, or real phone numbers/names.
          required: true
